services:
  orchestrator:
    build:
      context: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - orchestrator-data:/data/.agentic-collab
      - ${HOME}/.config/agentic-collab:/config/agentic-collab
      # PERSONAS_HOST_DIR should point to the canonical personas directory.
      # Default ./persistent-agents works as a directory or symlink to the real location.
      - ${PERSONAS_HOST_DIR:-./persistent-agents}:/app/persistent-personas
    # host.docker.internal resolves to the host on Docker Desktop (macOS/Windows).
    # On Linux, this requires Docker Engine 20.10+ with the host-gateway feature.
    # If host-gateway is unavailable, use --network=host or set
    # PROXY_HOST=172.17.0.1:3100 (docker0 bridge gateway) on the proxy instead.
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AGENTIC_COLLAB_CONFIG_DIR=/config/agentic-collab
      - PERSONAS_DIR=/app/persistent-personas
      - PERSONAS_HOST_DIR=${PERSONAS_HOST_DIR:-}
      - ORCHESTRATOR_HOST=${ORCHESTRATOR_HOST:-http://localhost:3000}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      # P2a presence-aware operator-reply relay (host-env injected, empty default →
      # relay is a safe no-op until provisioned; token is NEVER stored at-rest).
      - OPERATOR_RELAY_BOT_TOKEN=${OPERATOR_RELAY_BOT_TOKEN:-}
      - OPERATOR_RELAY_CHAT_ID=${OPERATOR_RELAY_CHAT_ID:-}
      # 120000 (was 60000) — Opus 4.6 cold-start + per-call proxy retry budget
      # (15s × 3 attempts) can blow past 60s on first launch. Watchdog only fires
      # on actual timeout, so healthy spawns are unaffected. See data/knowledge/
      # decisions/2026-04-30-eames-spawn-failure.md for the full diagnosis.
      - SPAWN_TIMEOUT_MS=120000
    labels:
      io.agentic-collab.role: orchestrator
    restart: unless-stopped
    # OOM-protect the orchestrator (2026-08-05 incident, lane-a durable fix). The
    # orchestrator is the fleet coordination substrate; under host-global OOM the kernel
    # OOM-killer must cull a WORKER/agent process (respawn-recoverable) rather than the
    # orchestrator. oom_score_adj -1000 makes it the last process the kernel picks.
    # NOT oom_kill_disable: that FREEZES the container under OOM (a hung orchestrator,
    # worse than killed+restarted) and is cgroup-v1-only. Tradeoff consciously ratified
    # (Brienne): -1000 = effectively never-kill, so a genuinely-leaking orchestrator would
    # have the kernel cull all workers first — accepted because orchestrator-death is
    # categorically worse and workers are respawn-recoverable.
    oom_score_adj: -1000
    # Healthcheck loosened (same incident) — belt-and-suspenders with the Dockerfile bake.
    # Old 5s/3-retry false-killed under transient event-loop load; 30s/5/60s keeps
    # genuine-hang protection while tolerating transient load. Permanent (was an emergency
    # override 2026-08-05); do not tighten without the incident context.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/orchestrator/status || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

volumes:
  orchestrator-data:
